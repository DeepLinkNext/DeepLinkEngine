name: Public one-click contract

on:
  pull_request:
  push:
    branches: [main, 'codex/public-one-click-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-download:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B tests/test_official_download.py
      - run: python -B tests/test_official_protocol_preparation.py
      - run: python -B tests/test_official_image_recovery.py
      - run: python -B tests/test_official_range_download.py
  public-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency audit test requirements
        run: python -m pip install --disable-pip-version-check packaging==26.3 pytest==8.3.2
      - run: python -B tools/verify_snapshot.py
      - run: python -B tools/verify_dependency_index.py
      - run: python -B tests/test_dependency_index.py
      - run: python -B datasets/verify.py
      - run: python -B one_click.py verify
      - run: python -B benchmark/one-click-kit/tests/test_checkpoint_cache.py
      - run: python -B benchmark/one-click-kit/tests/test_startup_cache_admission.py
      - run: python -B benchmark/one-click-kit/tests/test_child_runner.py
      - name: Verify source preparation, device waits and real local socket fallback
        run: python -B -m pytest -q benchmark/one-click-kit/tests/test_baseline_entry.py benchmark/one-click-kit/tests/test_pre_service_device_admission.py benchmark/one-click-kit/tests/test_deployment.py
      - name: Verify native memory monitoring against the actual controller statements
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -B -m pytest -q benchmark/one-click-kit/tests/test_native_checkpoint_reserve.py
      - name: Verify downloadable evaluation tools and declared workflow changes
        run: python -B tools/verify_evaluation_bundle.py --cache "${RUNNER_TEMP}/deeplink-evaluation"
      - run: python -B one_click.py run --help
      - run: python -B tools/test_public_one_click.py
      - run: python -B tools/test_public_run_all.py
      - run: python -B tests/test_official_baselines.py
      - run: python -B tests/test_official_kernel_preparation.py
      - run: python -B tests/test_official_inventory.py
      - run: python -B tests/test_official_opp_environment.py
      - run: python -B tests/test_official_phase_recovery.py
      - run: python -B tests/test_model_restore.py
      - run: python -B tests/test_official_range_download.py
      - run: python -B tests/test_cold_transfer.py
      - run: python -B tests/test_official_download.py
      - run: python -B tests/test_official_image_recovery.py
      - run: python -B tests/test_official_protocol_bootstrap.py
      - run: python -B tests/test_official_execution.py
      - run: python -B tests/test_official_protocol_preparation.py
      - run: python -B tests/test_official_judge_endpoint.py
      - run: python -B tests/test_official_sdk_state.py
      - run: python -B tests/test_official_runtime_identity.py
      - run: python -B tests/test_official_build_context.py
      - run: python -B tests/test_official_source_candidate.py
      - run: python -B tests/test_run_all.py
      - run: python -B tests/test_environment_setup.py
      - run: python -B tests/test_standalone.py
      - name: Verify stable selection, runtime admission and preserved assessment fixes
        run: python -B -m pytest -q tests/test_release_selection.py tests/test_versioned_reuse.py tests/test_multi_source_reuse.py tests/test_context_baseline_reuse.py tests/test_reference_baseline_reuse.py tests/test_warmup_memory_recovery.py tests/test_campaign_pair_weights.py tests/test_b0_run_policy.py tests/test_context_report_sources.py
      - run: python -B tests/test_runtime_storage.py
      - run: python -B tests/test_python_storage.py
      - name: Verify full acceptance decisions and real CPU report rendering
        run: |
          python -m pip install --disable-pip-version-check -r benchmark/one-click-kit/scripts/requirements-report.txt
          python -B tests/test_full_report.py
      - run: python -B tests/test_dataset_bundle.py
      - run: python -B tests/test_package_metadata.py
      - run: python -B tests/test_engine_install.py
      - run: python -B tests/test_baseline_bundle.py
      - run: python -B tests/test_artifact_cache.py
      - name: Verify public B0 archive hashes and the original OCI inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B baseline_bundle.py --verify-release --cache "${RUNNER_TEMP}/deeplink-b0"
      - run: python -B tests/test_baseline_setup.py
      - name: Cache frozen engine installation assets
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/deeplink-engine/wheels
          key: engine-assets-${{ hashFiles('engine/r8-lock.json') }}
      - name: Verify four real installation inputs and test routes share one latest stable selection
        run: python -B tools/verify_stable_default.py --download --cache "${RUNNER_TEMP}/deeplink-engine"
      - name: Verify compatibility metadata and unchanged official native payload
        run: python -B tools/verify_runtime_compatibility.py --cache "${RUNNER_TEMP}/deeplink-engine"
      - name: Cache fixed dataset originals
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/deeplink-fixed-data
          key: fixed-data-${{ hashFiles('data/bundles.json') }}
      - name: Verify repository data and reconstruct all evaluator plans offline
        run: python -B tools/verify_data_bundle.py --cache "${RUNNER_TEMP}/deeplink-fixed-data"
      - name: Fetch fixed reference evidence anonymously into an empty cache
        run: |
          unset GH_TOKEN GITHUB_TOKEN VLLM_HUST_PROJECT_EVIDENCE
          export XDG_CACHE_HOME="${RUNNER_TEMP}/deeplink-public-evidence"
          python -B one_click.py fetch-reference
      - name: Recompute the published current certificate from work and clock originals
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/deeplink-public-evidence
        run: python -B benchmark/reports/r8-compute-reference-20261119-v1/recompute.py
